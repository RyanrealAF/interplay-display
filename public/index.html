<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interplay-Display SaaS Engine</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge {
            display: inline-block;
            background-color: #22c55e;
            color: #0f172a;
            font-weight: bold;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
        }
        code {
            background-color: #0f172a;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #f43f5e;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">API Active</span>
        <h1>Interplay-Display SaaS Engine</h1>
        <p>Backend AI Audio Stem Separation & DSP Interplay Analytics Service.</p>
        <p>API Endpoint: <code>/api/v1/analyze</code></p>
    </div>
</body>
</html>
